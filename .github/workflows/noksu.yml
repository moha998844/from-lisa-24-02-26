name: Build Vili Kernel (Safe Mode - URL Fix)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: moha998844/from-lisa-24-02-26
          ref: lineage-23.2
          path: kernel_source

      - name: Patch Source and Strip Strictness
        run: |
          cd kernel_source
          
          # 1. Mandatory Kprobe Fixes (Required for KSU)
          sed -i '/bool trace_kprobe_on_func_entry/,/}/d' kernel/trace/trace_kprobe.c
          sed -i '/bool trace_kprobe_error_injectable/,/}/d' kernel/trace/trace_kprobe.c
          sed -i 's/probe_opcode_t/kprobe_opcode_t/g' arch/arm64/kernel/probes/decode-insn.h
          
          # 2. Global Werror Stripping
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g'

          # 3. Inject Configs (No LTO / No O3)
          {
            echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y"
            echo "CONFIG_LTO_NONE=y"
            echo "CONFIG_WERROR=n"
            echo "CONFIG_SCHED_WALT=y"
            echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y"
            echo "CONFIG_WIREGUARD=y"
            echo "CONFIG_QCOM_RPMH=y"
            echo "CONFIG_REGULATOR_QCOM_RPMH=y"
            echo "CONFIG_SECURITY_SELINUX=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_NEXT=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
          } >> arch/arm64/configs/vili_defconfig

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/moha998844/from-lisa-24-02-26
          kernel-branch: lineage-23.2
          kernel-dir: kernel_source
          config: vili_defconfig
          arch: arm64
          # Fix for Error 400: Disable automatic AOSP clang and provide direct URL
          aosp-clang: false
          other-clang-url: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz
          other-clang-branch: main
          aosp-gcc: true
          ksu: false
          extra-make-args: >-
            ["LLVM=1", "LLVM_IAS=1", "dtbs"]
          anykernel3: true
