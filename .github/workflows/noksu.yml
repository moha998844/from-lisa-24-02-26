name: Build Vili Kernel (Clean Test)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: moha998844/from-lisa-24-02-26
          ref: lineage-23.2
          path: kernel

      - name: Inject Configs & Source Patches
        run: |
          cd kernel
          # Injecting your core configs (Minus KSU for this test)
          echo "CONFIG_CC_OPTIMIZE_03=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_SCHED_WALT=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_WIREGUARD=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_QCOM_RPMH=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_REGULATOR_QCOM_RPMH=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_SECURITY_SELINUX=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_LTO_CLANG_THIN=y" >> arch/arm64/configs/vili_defconfig
          
          # These 3 are needed for KSU later, but safe to enable now
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/vili_defconfig

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/moha998844/from-lisa-24-02-26
          kernel-branch: lineage-23.2
          kernel-dir: kernel
          config: vili_defconfig
          arch: arm64
          
          # Toolchain
          aosp-clang: false
          other-clang-url: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          other-clang-branch: main
          aosp-gcc: true

          # KernelSU-Next DISABLED for this test
          ksu: false

          extra-make-args: >-
            ["LLVM=1", "LLVM_IAS=1", "dtbs"]
          anykernel3: true
