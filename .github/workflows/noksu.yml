name: Build Vili Kernel (Surgical Wi-Fi Patch)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: moha998844/from-lisa-24-02-26
          ref: lineage-23.2
          path: kernel_source

      - name: Patch Conflicts and Warnings
        run: |
          cd kernel_source
          # 1. Kprobe fixes (Redefinition errors)
          sed -i '/bool trace_kprobe_on_func_entry/,/}/d' kernel/trace/trace_kprobe.c
          sed -i '/bool trace_kprobe_error_injectable/,/}/d' kernel/trace/trace_kprobe.c
          sed -i 's/probe_opcode_t/kprobe_opcode_t/g' arch/arm64/kernel/probes/decode-insn.h
          
          # 2. Wi-Fi Driver - Surgical attribute injection
          # We add __maybe_unused so the compiler stops complaining about it being unused
          sed -i 's/static int  wlan_hdd_state_ctrl_param_create(void)/static int __maybe_unused wlan_hdd_state_ctrl_param_create(void)/g' drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c
          
          # 3. Force-disable Werror in the techpack and staging areas
          # These sub-folders often ignore the main Makefile flags
          find techpack/ drivers/staging/ -name "Makefile" | xargs sed -i 's/-Werror//g'
          find techpack/ drivers/staging/ -name "Kbuild" | xargs sed -i 's/-Werror//g'

          # 4. Inject your 13 Configs (Stored Prefs)
          # Note: We are ensuring CC_OPTIMIZE_03 is set as you requested
          echo "CONFIG_CC_OPTIMIZE_03=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_SCHED_WALT=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_WIREGUARD=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_QCOM_RPMH=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_REGULATOR_QCOM_RPMH=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_SECURITY_SELINUX=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_LTO_CLANG_THIN=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/vili_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/vili_defconfig

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/moha998844/from-lisa-24-02-26
          kernel-branch: lineage-23.2
          kernel-dir: kernel_source
          config: vili_defconfig
          arch: arm64
          aosp-clang: false
          other-clang-url: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          other-clang-branch: main
          aosp-gcc: true
          ksu: false
          extra-make-args: >-
            ["LLVM=1", "LLVM_IAS=1", "dtbs"]
          anykernel3: true
