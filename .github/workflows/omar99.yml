name: Build 0mar99 Vili (Merged Config + Android 16)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 0mar99 Source
        uses: actions/checkout@v4
        with:
          repository: AOSP-for-vili/android_kernel_xiaomi_sm8350
          ref: lineage-23.2
          path: kernel_source

      - name: Merge Fragments and Inject Configs
        run: |
          cd kernel_source
          
          # 1. Merge fragments: Base (Lahaina) + Vendor (Xiaomi) + Device (Vili)
          # We use the kernel's built-in merge tool
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O arch/arm64/configs/ \
            arch/arm64/configs/vendor/lahaina-qgki_defconfig \
            arch/arm64/configs/vendor/xiaomi_QGKI.config \
            arch/arm64/configs/vendor/vili_QGKI.config
          
          # Rename the hidden .config created by the merge tool to a valid defconfig name
          mv arch/arm64/configs/.config arch/arm64/configs/vili_merged_defconfig

          # 2. Inject your 13 Mandatory Configs + Fixes
          {
            echo "CONFIG_CC_OPTIMIZE_03=y"
            echo "CONFIG_SCHED_WALT=y"
            echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y"
            echo "CONFIG_WIREGUARD=y"
            echo "CONFIG_QCOM_RPMH=y"
            echo "CONFIG_REGULATOR_QCOM_RPMH=y"
            echo "CONFIG_SECURITY_SELINUX=y"
            echo "CONFIG_LTO_CLANG_THIN=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_NEXT=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_WERROR=n"
          } >> arch/arm64/configs/vili_merged_defconfig

          # 3. Source patches (Kprobes & Wi-Fi)
          sed -i '/bool trace_kprobe_on_func_entry/,/}/d' kernel/trace/trace_kprobe.c
          sed -i '/bool trace_kprobe_error_injectable/,/}/d' kernel/trace/trace_kprobe.c
          sed -i 's/static int  wlan_hdd_state_ctrl_param_create(void)/static int __maybe_unused wlan_hdd_state_ctrl_param_create(void)/g' drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g'

      - name: Upload Merged Config for Inspection
        uses: actions/upload-artifact@v4
        with:
          name: vili_merged_defconfig
          path: kernel_source/arch/arm64/configs/vili_merged_defconfig

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/AOSP-for-vili/android_kernel_xiaomi_sm8350
          kernel-branch: lineage-23.2
          kernel-dir: kernel_source
          config: vili_merged_defconfig
          arch: arm64
          aosp-clang: false
          # Android 16 QPR2 Recommended Clang
          other-clang-url: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          other-clang-branch: main
          aosp-gcc: true
          ksu: false 
          extra-make-args: >-
            ["LLVM=1", "LLVM_IAS=1", "dtbs"]
          anykernel3: true
